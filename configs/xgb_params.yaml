# XGBoost hyperparameters (Section 7.1 of the plan).

training:
  objective: "binary:logistic"
  num_rounds: 200
  max_depth: 6
  learning_rate: 0.1
  min_child_weight: 10
  subsample: 0.8
  colsample_bytree: 0.8
  scale_pos_weight: 30.0  # Auto-adjusted from class balance
  eval_metric: ["auc", "logloss"]
  early_stopping_rounds: 20
  seed: 42

# Hyperparameter search grid (Section 8.1 Milestone 3.2)
grid_search:
  max_depth: [4, 5, 6, 7]
  learning_rate: [0.05, 0.1, 0.2]
  min_child_weight: [5, 10, 20]

cross_validation:
  n_folds: 5
  fold_by: "scenario"  # Fold by scenario, not by row

export:
  format: "json"
  prune_redundant: true
  target_size_kb: 50
